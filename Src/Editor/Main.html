<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="darkreader-lock">
		<meta name="PageName" content="Editor">
		<meta name="Background" content="TextSlashes()">
		<title>Wiki Editor</title>
		<link rel="stylesheet" href="Editor.css">
		<link rel="stylesheet" href="../Global.css">
		<link rel="icon" type="image/png" href="/Assets/Icon/GooChess.png">
	</head>
	<body>
		<div id="Wrap">
			<div id="View"></div>
			<textarea id="Input" placeholder="Code"></textarea>
			<div id="Operate">
				<input id="Tag" type="text" placeholder="Tag">
				<trans onclick="ButtonFuncs.Load()">$.Load</trans>
				<trans onclick="ButtonFuncs.Apply()">$.Apply</trans>
				<trans onclick="ButtonFuncs.Arrow()">$.Arrow</trans>
			</div>
		</div>
		<script>
			let ButtonFuncs=new DOMRect;
		</script>
		<script type="module">
			import {DecodeGrood} from "../Syntax.js"
			import * as E from "./Editor.js"
			var Input=document.getElementById('Input');
			var Tag=document.getElementById('Tag');
			var ViewBox=document.getElementById('View');
			function LoadF()
			{
				ViewBox.innerHTML=
					`<div class="GroodWrap">
						<p>${Input.value}</p>
					</div>`;
				DecodeGrood();
				E.LaunchEditor(Input.value);
			}
			function ApplyF()
			{
				E.LaunchEditor(Input.value);
				if(Tag.value.length==0)
					return;
				var Grood=document.getElementsByTagName('grood')[0];
				Input.value=E.ApplyTag(Grood,Tag.value);
				Tag.value='';
				LoadF();
			}
			function ArrowF(){
				if(Tag.value.length==0)
					return;
				var Grood=document.getElementsByTagName('grood')[0];
				Input.value=E.AddArrow(Grood,Tag.value);
				Tag.value='';
				LoadF();
			}
			ButtonFuncs.Load=LoadF;
			ButtonFuncs.Apply=ApplyF;
			ButtonFuncs.Arrow=ArrowF;
		</script>
		<script type="module" src="../Global.js"></script>
	</body>
</html>
