<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="darkreader-lock">
		<meta name="PageName" content="Wiki">
		<meta name="Background" content="Triangles()">
		<title>Wiki</title>
		<link rel="stylesheet" href="Wiki.css">
		<link rel="stylesheet" href="../Global.css">
		<link rel="stylesheet" href="../Markdown.css">
		<link rel="icon" type="image/png" href="/Assets/Icon/GooChess.png">
	</head>
	<body>
		<span id="Tip"></span>
		<div id="Home"></div>
		<div id="Body">
			<div id="ContentWrap">
				<div id="Content">
					<a onclick="LoadMd('/Docs/Test.md')">Test.md</a>
					<a onclick="LoadMd('/Docs/Wiki.md')">Wiki.md</a>
					<a onclick="LoadMd('/Docs/Piece.md')">Piece.md</a>
					<a onclick="LoadMd('/Docs/API.md')">API.md</a>
				</div>
			</div>
			<div id="Main">
				<tranb>$.DebugTip</tranb>
			</div>
		</div>
		<script src="../marked.js"></script>
		<script>var LoadMd;</script>
		<script type="module">
			import {PCMake,DecodeGrood} from "../Syntax.js";
			var Main=document.getElementById("Main");
			async function LoadMdF(src)
			{
				await fetch(src,{headers:{'Cache-Control':'no-cache'}})
					.then((response)=>{return response.text()})
					.then((data)=>{
						var temp=PCMake(data);
						Main.innerHTML=marked.parse(temp);
						DecodeGrood();
					})
					.catch((reason)=>{console.error(reason);});
				};
			LoadMd=LoadMdF;
		</script>
		<script src="../Background.js" type="module"></script>
		<script type="module" src="../Global.js"></script>
	</body>
</html>
