<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="darkreader-lock">
		<meta name="PageName" content="Wiki">
		<title>Wiki</title>
		<link rel="stylesheet" href="Wiki.css">
		<link rel="stylesheet" href="../Global.css">
		<link rel="stylesheet" href="../Syntax.css">
		<link rel="icon" type="image/png" href="../../Icon/GooChess.png">
	</head>
	<body>
		<input type="file" id="Input">
		<span id="Tip"></span>
		<div id="Home"></div>
		<div id="Body">
			<div id="ContentWrap">
				<div id="Content">
					<a class="TRANS" href="../Menu/Main.html">Menu</a>
					<a class="TRANS" href="../Gaming/Main.html">Game</a>
					<a class="TRANS" href="../Editor/Main.html">Editor</a>
					<a class="TRANS">4</a>
					<a class="TRANS">5</a>
					<a class="TRANS">6</a>
				</div>
			</div>
			<div id="Main">
				<p class="TRANS">DebugTip</p>
			</div>
		</div>
		<script src="../marked.js"></script>
		<script type="module">
			import {PCMake,DecodeGrood} from "../Syntax.js";
			var Input=document.getElementById('Input');
			var Main=document.getElementById("Main");
			Input.addEventListener('change',function(event)
			{
				const files=event.target.files;
				if (files.length==0)
					return;
				const file=files[0];
				const reader=new FileReader();
				reader.onload=function(e)
				{
					var temp=PCMake(e.target.result);
					Main.innerHTML=marked.parse(temp);
					DecodeGrood();
				}
				reader.onerror=function(e)
					{console.error("Fail reading file");};
				reader.readAsText(file);
			});
		</script>
		<script src="Wiki.js"></script>
		<script src="../lang.js"></script>
		<script src="../Global.js"></script>
	</body>
</html>
